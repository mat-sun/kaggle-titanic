[project]
name = "kaggle-titanic"
version = "0.1.0"
description = "Kaggle Titanic single-file notebook with LightGBM and ruff configuration"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "jupyter>=1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.0.280",
  "pre-commit>=3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# ノートブック中心の開発なのでルールは緩めに設定します
line-length = 88
extend-ignore = ["E203", "W503"]
